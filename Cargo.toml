[package]
name = "mqtt-glide"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["justeff"]
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "High-throughput MQTT 5 Tokio client with enqueue-before-ack and no app event loop"
repository = "https://github.com/justeff/mqtt-glide"
homepage = "https://github.com/justeff/mqtt-glide"
documentation = "https://docs.rs/mqtt-glide"
keywords = ["mqtt", "mqtt5", "tokio", "async", "client"]
categories = ["network-programming", "asynchronous"]
# Keep the crates.io tarball lean; benches/tests stay in git for CI.
exclude = [
    "/benches/",
    "/conformance/",
    "/fuzz/",
    "/tests/",
    "/BENCHMARKS.md",
    "/CONTRIBUTING.md",
]

[lints.rust]
unsafe_code = "deny"

[package.metadata.docs.rs]
features = ["websocket", "testing", "stats", "flume"]

[[test]]
name = "faults"
path = "tests/faults/main.rs"
required-features = ["testing"]

[[test]]
name = "hostile"
path = "tests/hostile.rs"
required-features = ["testing"]

[[test]]
name = "testing"
path = "tests/testing.rs"
required-features = ["testing"]

[[test]]
name = "stats"
path = "tests/stats.rs"
required-features = ["testing", "stats"]

[[bench]]
name = "codec_throughput"
path = "benches/codec_throughput.rs"
harness = false

[[bench]]
name = "mqtt_compare"
path = "benches/mqtt_compare.rs"
harness = false
required-features = ["__bench"]

[features]
default = ["tls-rustls-aws-lc"]
# Exactly one rustls crypto provider. Do not enable both (compile_error) and do not use
# `--all-features`. Consumers embed via `default-features = false, features = [...]`.
tls-rustls-aws-lc = ["rustls/aws-lc-rs", "tokio-rustls/aws-lc-rs"]
tls-rustls-ring = ["rustls/ring", "tokio-rustls/ring"]
# MQTT over WebSocket (`ws://` / `wss://` broker URLs). `wss` reuses the client's own rustls
# setup; tokio-tungstenite only does the WebSocket handshake and framing.
websocket = ["dep:tokio-tungstenite"]
# Test helpers for applications: in-process `testing::TestBroker` and `testing::FaultProxy`.
# Meant for `[dev-dependencies]`; adds no dependencies.
testing = []
# `MqttClient::stats()`: counters of what the connection did, for the application to export.
# Adds no dependencies; without it the counting compiles away.
stats = []
# `InboundSink` for `flume::Sender<InboundMessage>`. Ties the API to flume 0.12: a flume
# upgrade here is a breaking change for code that enables this feature.
flume = ["dep:flume"]
# Internal: makes the wire codec and connection modules public for the crate's own tests,
# benches and fuzz target. Not part of the public API; no stability guarantees.
__internals = []
# Internal: hooks for the `mqtt_compare` bench only. Not part of the public API.
__bench = ["flume", "__internals"]

[dependencies]
arc-swap = "1.9"
bitflags = "2.13"
bytes = "1.12"
bytestring = "1.5"
flume = { version = "0.12", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# SIMD byte scans (NUL / wildcard rejection) on the codec hot path. Safe API;
# runtime-dispatched SSE2/AVX2 (x86_64) / NEON (aarch64) internally.
memchr = "2.7"
nonzero_ext = "0.3"
thiserror = "2.0.7"
# Crypto provider selected only via `tls-rustls-*` features above.
rustls = { version = "0.23.5", default-features = false, features = ["std"] }
rustls-native-certs = "0.8"
tokio = { version = "1.53", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
tracing = { version = "0.1.6", default-features = false }
uuid = { version = "1.24", features = ["v4"] }
# Wipes passwords on drop. Already in the tree through rustls.
zeroize = { version = "1.7", default-features = false, features = ["alloc"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
# Optional (`websocket` feature): handshake + framing only, no TLS / crypto provider of its own.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }

# Dev/bench only — not linked into dependents or a plain `cargo build`.
# `cargo test` / `cargo bench` resolve them (including rumqttc for mqtt_compare).
[dev-dependencies]
# The crate itself with its internals public, so integration tests and benches can drive the
# wire codec. No TLS feature here: the package's own feature selection supplies the provider.
mqtt-glide = { path = ".", default-features = false, features = ["__internals"] }
# Unit tests and the bench harness hand off through flume; the library only with the `flume` feature.
flume = "0.12"
# Bench: `getrusage` for subscriber CPU in `mqtt_compare` (see benches/support/cpu.rs).
libc = "0.2"
proptest = "1.11"
rstest = "0.26"
# Absolute multi-client matrix for `mqtt_compare` only (not runtime deps of the library).
# No crypto provider on rumqttc — the library feature under test supplies the single rustls provider.
# `mqtt5` (LabOverWire) is client-only here (no broker / WS / QUIC).
# Peer client versions are exact-pinned so the comparison is reproducible; bumping them
# requires a full compare re-bench. rumqttc-v5-next is pinned to 0.33.3 because 0.34.0 scans its
# whole outgoing in-flight table on every flush (the table is sized from the broker's Receive Maximum).
async-trait = "0.1"
mqtt5 = { version = "=0.48.0", default-features = false }
rumqttc-v5-next = { version = "=0.33.3", default-features = false, features = ["use-rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
testcontainers = { version = "0.28", default-features = false }
# Production tokio omits `rt-multi-thread`; integration tests / benches need it.
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
