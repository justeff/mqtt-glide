[package]
name = "mqtt-glide-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.12"
libfuzzer-sys = "0.4"
mqtt-glide = { path = ".." }

# Not part of the library workspace: built only by `cargo fuzz` (nightly).
[workspace]
members = ["."]

[[bin]]
name = "decode_frames"
path = "fuzz_targets/decode_frames.rs"
test = false
doc = false
bench = false
