name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aws-lc (default)
            args: ""
          - name: ring
            args: --no-default-features --features tls-rustls-ring
          - name: websocket
            args: --features websocket
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}
      - name: clippy (${{ matrix.name }})
        run: cargo clippy --all-targets --features testing ${{ matrix.args }} -- -D warnings
      - name: clippy with stats (${{ matrix.name }})
        run: cargo clippy --all-targets --features testing,stats,__bench ${{ matrix.args }} -- -D warnings
      # Test targets enable `__internals` through the self dev-dependency; the library as
      # shipped keeps the codec private, so check it on its own for dead code.
      - name: clippy library as shipped (${{ matrix.name }})
        run: cargo clippy --lib --features testing,stats,flume ${{ matrix.args }} -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aws-lc (default)
            args: ""
          - name: ring
            args: --no-default-features --features tls-rustls-ring
          - name: websocket
            args: --features websocket
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.name }}
      - name: lib (${{ matrix.name }})
        run: cargo test --lib --features testing,stats ${{ matrix.args }}
      - name: connection, redirect, proxy, codec properties (${{ matrix.name }})
        run: cargo test --test connection --test redirect --test proxy --test codec_proptest ${{ matrix.args }}
      - name: testing helpers, publish outcomes, hostile peers, TLS (${{ matrix.name }})
        run: cargo test --test testing --test publish_outcome --test hostile --test tls --features testing ${{ matrix.args }}
      - name: doctests (${{ matrix.name }})
        run: cargo test --doc --features testing,stats ${{ matrix.args }}
      - name: stats (${{ matrix.name }})
        run: cargo test --test stats --features testing,stats ${{ matrix.args }}
      - name: brokers (${{ matrix.name }})
        run: cargo test --test brokers ${{ matrix.args }}
      - name: faults (${{ matrix.name }})
        run: cargo test --test faults --features testing,stats ${{ matrix.args }}

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
      - name: cargo doc
        run: cargo doc --no-deps --features websocket,testing,stats,flume
        env:
          RUSTDOCFLAGS: -D warnings

  conformance:
    name: conformance matrix up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 conformance/render.py --check

  # Short smoke run on every push; longer runs are local (see fuzz/README.md).
  fuzz:
    name: fuzz (decode_frames, 60 s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: fuzz
      # The corpus only grows: each run restores the newest one and saves its own under a new key.
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      # New inputs go to the first corpus dir (the cached one); the committed seeds are read-only
      # extras (regenerate with `cargo run --example gen_seeds` in fuzz/).
      # The prebuilt cargo-fuzz defaults to its own musl target, where ASan cannot link.
      - name: cargo fuzz run
        working-directory: fuzz
        run: |
          mkdir -p corpus/decode_frames
          cargo fuzz run --target x86_64-unknown-linux-gnu decode_frames corpus/decode_frames seeds/decode_frames -- -max_total_time=60 -max_len=4096
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: check default TLS
        run: cargo check --lib
      - name: check ring TLS
        run: cargo check --lib --no-default-features --features tls-rustls-ring

  # Default features only: `tls-rustls-aws-lc` and `tls-rustls-ring` are mutually exclusive,
  # so the action's all-features heuristic cannot document the crate.
  # Release type is inferred from the version bump (0.1 → 0.2 = Cargo's 0.x "major").
  semver-checks:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: semver
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: default-features
